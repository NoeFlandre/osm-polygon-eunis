name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per PR (or per main commit); a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group dev
      - name: Keep the default pytest run under twelve seconds
        if: matrix.python-version == '3.12'
        run: |
          log_file="$RUNNER_TEMP/default-pytest.log"
          if .venv/bin/pytest --durations=20 >"$log_file" 2>&1; then
            cat "$log_file"
          else
            test_status=$?
            cat "$log_file"
            exit "$test_status"
          fi
          elapsed="$(sed -nE 's/^=+.* in ([0-9]+(\.[0-9]+)?)s =+$/\1/p' "$log_file" | tail -n 1)"
          if [ -z "$elapsed" ]; then
            echo "Could not read pytest's reported runtime" >&2
            exit 1
          fi
          echo "Default pytest runtime: ${elapsed}s (limit: 12s)"
          python -c 'import sys; sys.exit(float(sys.argv[1]) >= 12)' "$elapsed"
      - run: make quality

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv build
      - name: Smoke-install the wheel in an isolated environment
        run: uv run --isolated --no-project --with dist/*.whl osm-polygon-eunis --help
      - name: Verify the installed wheel includes the default EEA config
        working-directory: ${{ runner.temp }}
        run: >-
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl
          python -c 'from osm_polygon_eunis.cli import _default_reference_config; assert
          _default_reference_config().is_file()'
      - run: uv sync --locked --group dev
      - run: uv run mkdocs build --strict

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the runtime image
        run: docker build --tag osm-polygon-eunis:ci .
      - name: Check runtime user and image history for Hub credentials
        env:
          IMAGE: osm-polygon-eunis:ci
        run: |
          image_user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
          if [ -z "$image_user" ] || [ "$image_user" = "0" ] || [ "$image_user" = "root" ] || [ "$image_user" = "0:0" ]; then
            echo "runtime image does not use a non-root user" >&2
            exit 1
          fi
          history="$(docker history --no-trunc --format '{{.CreatedBy}}' "$IMAGE")"
          if printf '%s\n' "$history" | grep -Eiq 'HF_TOKEN|HUGGINGFACE_HUB_TOKEN|hf_[A-Za-z0-9]{20,}'; then
            echo "Hub credential marker found in runtime image history" >&2
            exit 1
          fi
      - name: Check the CLI as the image's non-root user
        run: |
          docker run --rm osm-polygon-eunis:ci --help
          docker run --rm osm-polygon-eunis:ci plan --help

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Export locked requirements
        run: uv export --locked --all-groups --no-emit-project --format requirements-txt -o requirements.lock.txt
      - name: Audit locked dependencies
        run: uvx pip-audit==2.10.1 --strict --require-hashes --disable-pip -r requirements.lock.txt

  # Single required check for branch protection.
  qa-ok:
    if: always()
    needs: [deterministic-quality, build, docker, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every QA job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
