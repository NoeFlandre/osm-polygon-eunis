name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per PR (or per main commit); a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group dev
      - run: make quality

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv build
      - name: Smoke-install the wheel in an isolated environment
        run: uv run --isolated --no-project --with dist/*.whl osm-polygon-eunis --help
      - name: Verify the installed wheel includes the default EEA config
        working-directory: ${{ runner.temp }}
        run: >-
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl
          python -c 'from osm_polygon_eunis.cli import _default_reference_config; assert
          _default_reference_config().is_file()'
      - run: uv sync --locked --group dev
      - run: uv run mkdocs build --strict

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the runtime image
        run: docker build --tag osm-polygon-eunis:ci .
      - name: Check runtime user and image history for Hub credentials
        env:
          IMAGE: osm-polygon-eunis:ci
        run: |
          image_user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
          if [ -z "$image_user" ] || [ "$image_user" = "0" ] || [ "$image_user" = "root" ] || [ "$image_user" = "0:0" ]; then
            echo "runtime image does not use a non-root user" >&2
            exit 1
          fi
          history="$(docker history --no-trunc --format '{{.CreatedBy}}' "$IMAGE")"
          if printf '%s\n' "$history" | grep -Eiq 'HF_TOKEN|HUGGINGFACE_HUB_TOKEN|hf_[A-Za-z0-9]{20,}'; then
            echo "Hub credential marker found in runtime image history" >&2
            exit 1
          fi
      - name: Check the CLI as the image's non-root user
        run: |
          docker run --rm osm-polygon-eunis:ci --help
          docker run --rm osm-polygon-eunis:ci plan --help

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Export locked requirements
        run: uv export --locked --all-groups --no-emit-project --format requirements-txt -o requirements.lock.txt
      - name: Audit locked dependencies
        run: uvx pip-audit==2.10.1 --strict --require-hashes --disable-pip -r requirements.lock.txt

  # Single required check for branch protection.
  qa-ok:
    if: always()
    needs: [deterministic-quality, build, docker, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every QA job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
