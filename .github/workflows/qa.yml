name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per PR (or per main commit); a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run ty check src tests scripts
      - run: uv run pytest --cov --cov-report=json --cov-report=term-missing
      - run: uv run python scripts/check_architecture.py
      - run: uv run python scripts/check_crap.py
      - run: uv run python scripts/smoke.py
      - run: uv run mutmut run

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv build
      - name: Smoke-install the wheel in an isolated environment
        run: uv run --isolated --no-project --with dist/*.whl osm-polygon-eunis --help
      - run: uv sync --locked --group dev
      - run: uv run mkdocs build --strict

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Export locked requirements
        run: uv export --locked --all-groups --no-emit-project --format requirements-txt -o requirements.lock.txt
      - name: Audit locked dependencies
        run: uvx pip-audit==2.10.1 --strict --require-hashes --disable-pip -r requirements.lock.txt

  # Single required check for branch protection.
  qa-ok:
    if: always()
    needs: [deterministic-quality, build, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every QA job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
