name: Mutation testing

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/check_mutation.py"
      - "tests/unit/test_check_mutation.py"
      - "pyproject.toml"
      - ".github/workflows/mutation.yml"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - name: Run mutation tests
        run: uv run mutmut run --max-children 2
      - name: Export and enforce the 91.9% score baseline
        run: |
          uv run mutmut export-cicd-stats
          uv run mutmut results --all true > mutation-results.txt
          cat mutation-results.txt
          uv run python scripts/check_mutation.py
      - name: Preserve mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report-${{ github.run_id }}
          path: |
            mutants/mutmut-cicd-stats.json
            mutation-results.txt
          if-no-files-found: warn
          retention-days: 14
