name: Mutation testing

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/check_mutation.py"
      - "tests/unit/test_check_mutation.py"
      - "pyproject.toml"
      - ".github/workflows/mutation.yml"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

# One run per PR; a newer push cancels the older run. Scheduled and manual runs are not cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - name: Run mutation tests
        run: uv run mutmut run --max-children 2
      - name: Export and enforce the per-module score baselines
        run: |
          uv run mutmut export-cicd-stats
          uv run mutmut results --all true > mutation-results.txt
          uv run python scripts/check_mutation.py
      - name: Preserve mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ github.run_id }}
          path: |
            mutants/mutmut-cicd-stats.json
            mutation-results.txt
          if-no-files-found: warn
          retention-days: 14
