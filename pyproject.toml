[project]
name = "osm-polygon-eunis"
version = "0.1.0"
description = "Enrich OSM polygon Hugging Face datasets with exact-overlap EUNIS labels."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7,<1",
  "httpx>=0.27,<1",
  "huggingface-hub>=1.32,<2",
  "numpy>=2,<3",
  "pyarrow>=18,<26",
  "pyproj>=3.7,<4",
  "rasterio>=1.4,<2",
  "shapely>=2.0,<3",
]

[project.scripts]
osm-polygon-eunis = "osm_polygon_eunis.cli:main"

[dependency-groups]
dev = [
  "coverage[toml]>=7.6,<8",
  "hypothesis>=6.120,<7",
  "mkdocs-material>=9.5,<10",
  "mutmut>=3.2,<4",
  "pytest>=8.3,<10",
  "pytest-bdd>=8,<9",
  "pytest-cov>=6,<8",
  "radon>=6,<7",
  "ruff>=0.9,<1",
  "ty>=0.0.1a20,<0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osm_polygon_eunis"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "property: deterministic property-based tests",
]

[tool.coverage.run]
branch = true
source = ["src/osm_polygon_eunis"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E", "F", "I", "B", "UP", "SIM", "C4", "RUF",
  # Anti-pattern guardrails (#30).
  "C90", "PTH", "DTZ", "BLE", "ERA", "PIE", "RET", "N", "TID", "PGH",
  "PERF", "S", "ARG", "T20", "PL",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# Ratchet: start at 8, lower toward 6 as parameter lists become dataclasses.
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "ARG005", "PLR2004", "PLC0415"]
# Internal type-narrowing invariants, not input validation.
"src/osm_polygon_eunis/matching.py" = ["S101"]
"src/osm_polygon_eunis/reference.py" = ["S101"]
"src/osm_polygon_eunis/references.py" = ["S101"]
# PLR0913 ratchet (#30): these modules still take long parameter lists; remove
# an entry once its functions move to parameter dataclasses.
"src/osm_polygon_eunis/geometry_jobs.py" = ["PLR0913"]
"src/osm_polygon_eunis/manifest_state.py" = ["PLR0913"]
"src/osm_polygon_eunis/publish.py" = ["PLR0913"]
"src/osm_polygon_eunis/runner.py" = ["PLR0913"]
"scripts/**" = ["T201"]
"src/osm_polygon_eunis/cli.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"

[tool.mutmut]
source_paths = ["src/osm_polygon_eunis/matching.py"]
also_copy = ["src/osm_polygon_eunis/domain.py", "src/osm_polygon_eunis/geometry.py", "src/osm_polygon_eunis/__init__.py"]
pytest_add_cli_args_test_selection = ["tests/unit/test_matching.py"]
