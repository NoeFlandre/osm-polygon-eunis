[project]
name = "osm-polygon-eunis"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Enrich OSM polygon Hugging Face datasets with exact-overlap EUNIS labels."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "defusedxml>=0.7,<1",
  "httpx>=0.27,<1",
  "huggingface-hub>=1.32,<3",
  "numpy>=2,<3",
  "pyarrow>=18,<26",
  "pyproj>=3.7,<4",
  "rasterio>=1.4,<2",
  "shapely>=2.0,<3",
]

[project.scripts]
osm-polygon-eunis = "osm_polygon_eunis.cli:main"

[dependency-groups]
dev = [
  "coverage[toml]>=7.6,<8",
  "hypothesis>=6.120,<7",
  "mkdocs-material>=9.5,<10",
  "mutmut>=3.2,<4",
  "pytest>=8.3,<10",
  "pytest-bdd>=8,<9",
  "pytest-cov>=6,<8",
  "radon>=6,<7",
  "ruff>=0.9,<1",
  "ty>=0.0.1a20,<0.1",
  "vulture==2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osm_polygon_eunis"]

[tool.hatch.build.targets.wheel.force-include]
"config/eea-2021-reference.json" = "osm_polygon_eunis/eea-2021-reference.json"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -m 'not slow'"
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
  "property: deterministic property-based tests",
  "slow: computational tests run separately by the full quality target",
]

[tool.coverage.run]
branch = true
source = ["src/osm_polygon_eunis"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "benchmarks"]

[tool.ruff.lint]
select = [
  "E", "F", "I", "B", "UP", "SIM", "C4", "RUF",
  "D",
  # Anti-pattern guardrails.
  "C90", "PTH", "DTZ", "BLE", "ERA", "PIE", "RET", "N", "TID", "PGH",
  "PERF", "S", "ARG", "T20", "PL",
  # Exception hygiene and annotations. EM/D are intentionally not enabled.
  "TRY", "ANN",
  # Logging and gettext-style string formatting guardrails.
  "LOG", "G",
]
ignore = [
  "TRY003",  # long messages in raise are the house style
  "ANN401",  # Any is deliberate at third-party protocol boundaries
  "D202",  # Keep the repository's blank line after docstrings.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# Ratchet: start at 8, lower toward 6 as parameter lists become dataclasses.
max-args = 6

[tool.ruff.lint.per-file-ignores]
# Assertions are appropriate for test and benchmark invariants, not input validation.
"tests/**" = ["S101", "S106", "ARG005", "PLR2004", "PLC0415", "ANN", "D"]
"benchmarks/**" = ["S101", "D"]
# These test fixtures assert that ephemeral local paths are rejected.
"tests/unit/test_grid5000.py" = ["S108"]
# Internal type-narrowing invariants, not input validation.
"src/osm_polygon_eunis/matching.py" = ["S101"]
# Keep parameter-list limits enabled for all production modules.
"scripts/**" = ["T201"]
"src/osm_polygon_eunis/cli.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.terminal]
# Any ty warning fails CI (#31).
error-on-warning = true

[tool.ty.rules]
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"

[tool.mutmut]
source_paths = ["src/osm_polygon_eunis/matching.py", "src/osm_polygon_eunis/geometry.py"]
also_copy = ["src/osm_polygon_eunis/domain.py", "src/osm_polygon_eunis/__init__.py"]
pytest_add_cli_args_test_selection = [
  "tests/unit/test_matching.py",
  "tests/unit/test_geometry.py",
  "tests/property/test_geometry_properties.py",
]
