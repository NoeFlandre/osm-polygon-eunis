[project]
name = "osm-polygon-eunis"
version = "0.1.0"
description = "Enrich OSM polygon Hugging Face datasets with exact-overlap EUNIS labels."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "huggingface-hub>=0.35,<1",
  "numpy>=2,<3",
  "pyarrow>=18,<23",
  "pyproj>=3.7,<4",
  "rasterio>=1.4,<2",
  "shapely>=2.0,<3",
]

[project.scripts]
osm-polygon-eunis = "osm_polygon_eunis.cli:main"

[dependency-groups]
dev = [
  "coverage[toml]>=7.6,<8",
  "hypothesis>=6.120,<7",
  "mkdocs-material>=9.5,<10",
  "mutmut>=3.2,<4",
  "pytest>=8.3,<10",
  "pytest-bdd>=8,<9",
  "pytest-cov>=6,<8",
  "radon>=6,<7",
  "ruff>=0.9,<1",
  "ty>=0.0.1a20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osm_polygon_eunis"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/osm_polygon_eunis"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"

[tool.mutmut]
paths_to_mutate = "src/osm_polygon_eunis/matching.py"
runner = "UV_CACHE_DIR=/private/tmp/osm-polygon-eunis-uv uv run pytest -q tests/unit/test_matching.py"
tests_dir = "tests"
